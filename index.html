<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="LwyJr — 从零基础到前后端大牛的全栈学习平台，动画教学、实战演练、完整学习路线。对比 W3Schools/MDN/freeCodeCamp 打造最优教程体验。" />
  <meta name="color-scheme" content="light dark" />
  <link rel="canonical" href="https://lwyjr.com" />
  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="LwyJr — 从0到前后端大牛 | 动画教学 · 实战演练 · 全栈路线" />
  <meta property="og:description" content="零基础友好、动画教学、在线代码演练，系统化学习 HTML/CSS/JS/TS/Vue/React/Node.js 全栈开发。" />
  <meta property="og:url" content="https://lwyjr.com" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="LwyJr — 从0到前后端大牛" />
  <meta name="twitter:description" content="零基础友好、动画教学、在线代码演练，系统化学习全栈开发。" />
  <title>LwyJr — 从0到前后端大牛 | 动画教学 · 实战演练 · 全栈路线</title>
  <script>
    // Prevent flash of wrong theme — runs before Vue mounts
    (function() {
      var t = localStorage.getItem('lwyjr-theme-preference');
      var isDark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
      document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
    })();
  </script>
</head>

<body>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
